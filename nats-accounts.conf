# Default mesh: per-agent NATS users with least-privilege subject
# permissions, verified against a real nats-server (2.14.5) -- see
# backend/tests/test_nats_accounts_enforcement.py, which boots one from this
# exact file and proves a scoped user really cannot publish or subscribe
# outside its own grant, not just that the syntax parses.
#
# `docker-compose.infra.yml` starts NATS with this file and requires each
# per-agent password. The setup wizard generates them into `.env`; deployments
# supply them through their secret manager. Runtime clients fail closed when
# either generic `NATS_USER` or `NATS_PASSWORD` is missing.
#
# SCOPE, STATED PLAINLY: stream administration belongs to the dedicated
# `nats_provisioner` identity below, not to runtime agents. Runtime agents
# receive only JetStream publish, consumer, acknowledgement, and metadata API
# permissions needed by their own subscriptions. BaseAgent skips its automatic
# stream bootstrap when authenticated runtime credentials are enabled; the
# provisioner must run `setup_nats_streams.py` first. This prevents a
# compromised agent from creating, updating, deleting, or inspecting arbitrary
# streams while retaining normal durable subscription behavior.
#
# KNOWN LIMITATION, OBSERVED DIRECTLY (not assumed): a denied *subscribe*
# does not raise synchronously on the caller -- `nc.subscribe(...)` returns
# normally, and the denial surfaces only through the registered `error_cb`
# (`BaseAgent._on_nats_error`, which logs at ERROR level). A denied
# *publish* through JetStream does raise on the caller (the ack request
# times out), because the message is silently dropped server-side and never
# reaches a stream to ack. A grant that is wrong in the too-narrow direction
# therefore fails as a logged error and a quietly-deaf subscription, not a
# crash -- watch the log, this file does not make misconfiguration loud on
# its own.
#
# TLS is deliberately not included -- deferred until the mesh crosses a
# machine boundary (the robot-plus-server split), which plaintext
# credentials over a loopback/private Docker network do not need yet.

# Empty on purpose: enables JetStream (matching docker-compose.infra.yml's
# `-js` flag) without pinning a store_dir here, so a `-sd <path>` command-line
# flag -- e.g. a test's own tmp_path -- can set one without the "duplicate
# store_dir configuration" parse error a hardcoded value here would cause.
jetstream {}

authorization {
  users = [
    { user: "nats_provisioner", password: $NATS_PROVISIONER_PASSWORD, permissions: {
        publish: { allow: ["$JS.API.>"] }
        subscribe: { allow: ["_INBOX.>"] }
    }},
    # main.py: LiveKit tokens, vision.control, and the web chat bridge
    # (app/api/chat.py), which sends chat.input and consumes chat.output and
    # cache.sync through durable push consumers. The web-facing process gets
    # only what BaseAgent.subscribe calls (stream lookup, consumer info,
    # durable create; deliveries arrive on _INBOX): no consumer delete, no
    # ephemeral create, so it cannot tamper with another agent's consumer.
    { user: "signaling", password: $NATS_SIGNALING_PASSWORD, permissions: {
        publish: {
          allow: ["$JS.API.STREAM.NAMES",
                  "$JS.API.CONSUMER.DURABLE.CREATE.AI_MESSAGES.>",
                  "$JS.API.CONSUMER.INFO.AI_MESSAGES.>",
                  "$JS.ACK.AI_MESSAGES.>",
                  "vision.control",
                  "chat.input"]
        }
        subscribe: { allow: ["_INBOX.>"] }
    }},
    { user: "brain_agent", password: $NATS_BRAIN_PASSWORD, permissions: {
        publish: {
          allow: ["$JS.API.STREAM.NAMES",
                  "$JS.API.CONSUMER.DURABLE.CREATE.AI_MESSAGES.>",
                  "$JS.API.CONSUMER.INFO.AI_MESSAGES.>",
                  "$JS.API.CONSUMER.DELETE.AI_MESSAGES.>",
                  "$JS.ACK.AI_MESSAGES.>",
                  "$JS.API.CONSUMER.DURABLE.CREATE.AI_AUDIO.>",
                  "$JS.API.CONSUMER.INFO.AI_AUDIO.>",
                  "$JS.API.CONSUMER.DELETE.AI_AUDIO.>",
                  "$JS.ACK.AI_AUDIO.>",
                  "chat.output",
                  "audio.stop",
                  "audio.resume",
                  "audio.pre_generate",
                  "state.broadcast",
                  "state.update",
                  "telemetry.reflection",
                  "cache.sync"]
        }
        subscribe: {
          allow: ["_INBOX.>"]
        }
    }},
    { user: "subconscious_agent", password: $NATS_SUBCONSCIOUS_PASSWORD, permissions: {
        publish: {
          allow: ["$JS.API.STREAM.NAMES",
                  "$JS.API.CONSUMER.DURABLE.CREATE.AI_MESSAGES.>",
                  "$JS.API.CONSUMER.INFO.AI_MESSAGES.>",
                  "$JS.API.CONSUMER.DELETE.AI_MESSAGES.>",
                  "$JS.ACK.AI_MESSAGES.>",
                  "$JS.API.CONSUMER.DURABLE.CREATE.AI_AUDIO.>",
                  "$JS.API.CONSUMER.INFO.AI_AUDIO.>",
                  "$JS.ACK.AI_AUDIO.>",
                  "$JS.API.CONSUMER.DURABLE.CREATE.AI_STATE.>",
                  "$JS.API.CONSUMER.INFO.AI_STATE.>",
                  "$JS.ACK.AI_STATE.>",
                  "chat.input",
                  "state.subconscious"]
        }
        subscribe: {
          allow: ["_INBOX.>"]
        }
    }},
    { user: "surfacing_agent", password: $NATS_SURFACING_PASSWORD, permissions: {
        publish: {
          allow: ["$JS.API.STREAM.NAMES",
                  "$JS.API.CONSUMER.DURABLE.CREATE.AI_MESSAGES.>",
                  "$JS.API.CONSUMER.INFO.AI_MESSAGES.>",
                  "$JS.ACK.AI_MESSAGES.>",
                  "agent.voice.modulation",
                  "memory.surfaced"]
        }
        subscribe: {
          allow: ["_INBOX.>"]
        }
    }},
    { user: "system_agent", password: $NATS_SYSTEM_PASSWORD, permissions: {
        publish: {
          allow: ["$JS.API.STREAM.NAMES",
                  "$JS.API.CONSUMER.DURABLE.CREATE.AI_MESSAGES.>",
                  "$JS.API.CONSUMER.INFO.AI_MESSAGES.>",
                  "$JS.ACK.AI_MESSAGES.>",
                  "system.tick"]
        }
        subscribe: {
          allow: ["_INBOX.>"]
        }
    }},
    { user: "transport_agent", password: $NATS_TRANSPORT_PASSWORD, permissions: {
        publish: {
          allow: ["$JS.API.STREAM.NAMES",
                  "$JS.API.CONSUMER.DURABLE.CREATE.AI_MESSAGES.>",
                  "$JS.API.CONSUMER.INFO.AI_MESSAGES.>",
                  "$JS.ACK.AI_MESSAGES.>",
                  "$JS.API.CONSUMER.DURABLE.CREATE.AI_AUDIO.>",
                  "$JS.API.CONSUMER.INFO.AI_AUDIO.>",
                  "$JS.ACK.AI_AUDIO.>",
                  "audio.inbound",
                  "audio.playback.progress",
                  "audio.playback.lifecycle",
                  "audio.playback.backlog",
                  "state.presence"]
        }
        subscribe: {
          allow: ["_INBOX.>"]
        }
    }},
    { user: "vision_agent", password: $NATS_VISION_PASSWORD, permissions: {
        publish: {
          allow: ["$JS.API.STREAM.NAMES",
                  "$JS.API.CONSUMER.DURABLE.CREATE.AI_MESSAGES.>",
                  "$JS.API.CONSUMER.INFO.AI_MESSAGES.>",
                  "$JS.ACK.AI_MESSAGES.>",
                  "vision.frames",
                  "vision.description",
                  "vision.facial_reflex"]
        }
        subscribe: {
          allow: ["_INBOX.>"]
        }
    }},
    # Rust agents connect via async-nats directly, not through BaseAgent, so
    # they never auto-subscribe to cache.sync -- omitted for these two,
    # deliberately, not by oversight.
    { user: "stt_agent", password: $NATS_STT_PASSWORD, permissions: {
        publish: {
          allow: ["ambient.noise.telemetry", "audio.perception",
                   "audio.stop", "chat.input", "user.voice.properties"]
        }
        subscribe: {
          allow: ["_INBOX.>", "audio.inbound"]
        }
    }},
    { user: "voice_agent", password: $NATS_VOICE_PASSWORD, permissions: {
        publish: {
          allow: ["audio.stream", "audio.playback.visemes"]
        }
        subscribe: {
          allow: ["_INBOX.>", "chat.output", "agent.voice.modulation",
                   "ambient.noise.telemetry", "audio.resume", "audio.stop",
                   "vision.description"]
        }
    }},
  ]
}
