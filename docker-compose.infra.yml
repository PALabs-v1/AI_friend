
# P0-2: every host port binding below is prefixed 127.0.0.1: (loopback-only).
# audit/ (M4-S3, M4-S8) found all nine infra services published on 0.0.0.0,
# reachable by anything on the LAN -- including the LiveKit SFU, which meant
# any LAN device could join a live voice session or run
# inference for free on the local Ollama instance. The maintainer's answer
# (2026-08-22) is that this is a single-host personal/family deployment, not
# a multi-tenant or multi-machine one, so nothing needs LAN reach. If a
# service ever needs to be reached from another machine (e.g. the frontend
# served elsewhere), narrow the binding back on that one service and record
# why, rather than reverting this file wholesale.
services:
  # 1. Event Bus (NATS JetStream)
  nats:
    image: nats:${NATS_IMAGE_TAG:-2.10.24-alpine}
    container_name: nats_mesh
    entrypoint: [ "nats-server" ]
    command: [ "-js", "-m", "8222", "-c", "/etc/nats/nats-accounts.conf" ]
    environment:
      NATS_PROVISIONER_PASSWORD: ${NATS_PROVISIONER_PASSWORD:?run friend init to generate NATS credentials}
      NATS_SIGNALING_PASSWORD: ${NATS_SIGNALING_PASSWORD:?run friend init to generate NATS credentials}
      NATS_BRAIN_PASSWORD: ${NATS_BRAIN_PASSWORD:?run friend init to generate NATS credentials}
      NATS_SUBCONSCIOUS_PASSWORD: ${NATS_SUBCONSCIOUS_PASSWORD:?run friend init to generate NATS credentials}
      NATS_SURFACING_PASSWORD: ${NATS_SURFACING_PASSWORD:?run friend init to generate NATS credentials}
      NATS_SYSTEM_PASSWORD: ${NATS_SYSTEM_PASSWORD:?run friend init to generate NATS credentials}
      NATS_TRANSPORT_PASSWORD: ${NATS_TRANSPORT_PASSWORD:?run friend init to generate NATS credentials}
      NATS_STT_PASSWORD: ${NATS_STT_PASSWORD:?run friend init to generate NATS credentials}
      NATS_VISION_PASSWORD: ${NATS_VISION_PASSWORD:?run friend init to generate NATS credentials}
      NATS_VOICE_PASSWORD: ${NATS_VOICE_PASSWORD:?run friend init to generate NATS credentials}
    ports:
      - "127.0.0.1:4222:4222" # Client connections
      - "127.0.0.1:8222:8222" # HTTP monitoring
    volumes:
      - ./nats-accounts.conf:/etc/nats/nats-accounts.conf:ro
    working_dir: /
    networks:
      - ai_mesh_network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 2. PostgreSQL with PGVector (RAG + Conversation History)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres_db
    environment:
      POSTGRES_USER: ai_friend
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ai_friend_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai_mesh_network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_friend -d ai_friend_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Neo4j (Knowledge Graph)
  neo4j:
    image: neo4j:${NEO4J_IMAGE_TAG:-5.26.0}
    container_name: brain_graph
    entrypoint: [ "tini", "-g", "--", "/startup/docker-entrypoint.sh" ]
    command: [ "neo4j" ]
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
      NEO4J_PLUGINS: ${NEO4J_PLUGINS:-["apoc"]}
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_PASSWORD:-ci_dummy}\" \"RETURN 1;\" || wget --quiet --tries=1 --spider http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "127.0.0.1:7474:7474" # HTTP
      - "127.0.0.1:7687:7687" # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    working_dir: /var/lib/neo4j
    networks:
      - ai_mesh_network
    restart: always

  # 4. Redis (Caching + LiveKit Signaling)
  redis:
    image: redis:7-alpine
    container_name: brain_cache
    entrypoint: [ "docker-entrypoint.sh" ]
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    working_dir: /data
    networks:
      - ai_mesh_network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. LiveKit (WebRTC SFU)
  livekit:
    image: livekit/livekit-server:${LIVEKIT_IMAGE_TAG:-latest}
    container_name: local_sfu
    entrypoint: [ "/livekit-server" ]
    command: [ "--config", "/etc/livekit.yaml" ]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    ports:
      - "127.0.0.1:7880:7880/tcp"
      - "127.0.0.1:7881:7881/tcp"
      - "127.0.0.1:50000-51000:50000-51000/udp"
    environment:
      - "LIVEKIT_KEYS=${LIVEKIT_KEYS}"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ai_mesh_network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7880 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 6. Ollama (Local LLM)
  ollama:
    profiles: ["docker-ollama"]
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.5.7}
    container_name: local_brain
    entrypoint: [ "/bin/ollama" ]
    command: [ "serve" ]

    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - ai_mesh_network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 7. GPT-SoVITS (Local TTS) - Optimized for RTX-series GPUs
  gpt-sovits:
    build:
      context: ./backend
      dockerfile: Dockerfile.sovits
    container_name: local_voice
    environment:
      - is_half=true
      - CUDA_VISIBLE_DEVICES=0
      - LITE=true
      - WORKFLOW=true
      - PYTHONPATH=/workspace/GPT-SoVITS
      - CUSTOM_GPT_PATH=${CUSTOM_GPT_PATH:-GPT_weights/ai_friend_voice.ckpt}
      - CUSTOM_SOVITS_PATH=${CUSTOM_SOVITS_PATH:-SoVITS_weights/ai_friend_voice.pth}
      # Same vars voice_agent reads (docker-compose.prod.yml) -- read by
      # sovits_healthcheck.sh/sovits_bootstrap.sh so a custom reference clip
      # stays consistent across both containers instead of drifting.
      - REF_AUDIO_PATH=${REF_AUDIO_PATH:-output/sample_en_gold.wav}
      - REF_TEXT=${REF_TEXT:-At the end of the exam, the program shows the performance summary.}
    ports:
      - "127.0.0.1:9880:9880" # WebUI
      - "127.0.0.1:9871:9871" # API
    volumes:
      - voice_models:/workspace/models/pretrained_models
      - ./backend/voice_samples:/workspace/GPT-SoVITS/output
      - ./models/GPT_weights:/workspace/GPT-SoVITS/GPT_weights
      - ./models/SoVITS_weights:/workspace/GPT-SoVITS/SoVITS_weights
      - ./backend/scripts/bootstrap/sovits_bootstrap.sh:/workspace/sovits_bootstrap.sh
      - ./backend/scripts/bootstrap/sovits_healthcheck.sh:/workspace/sovits_healthcheck.sh
    shm_size: 16gb
    networks:
      - ai_mesh_network
    restart: always
    healthcheck:
      # Real synthesis probe, not a status ping -- see sovits_healthcheck.sh
      # for why. `timeout` here (10s) must stay above the script's own -m 8
      # curl deadline, or Docker could kill the check before curl reports.
      test: ["CMD-SHELL", "bash /workspace/sovits_healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 500s

  # 8. Qdrant (Vector Database)
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: brain_vectors
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ai_mesh_network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "./qdrant --version || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  ai_mesh_network:
    name: ai_mesh_network
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  ollama_models:
  voice_models:
  qdrant_data:
