
services:
  # Provision streams with the only identity that has JetStream
  # administration rights. Runtime agents wait for this one-shot service and
  # receive their own scoped credentials below.
  nats_provisioner:
    build:
      context: ./backend
      target: slim
    container_name: nats_provisioner
    command: [ "python", "scripts/bootstrap/setup_nats_streams.py" ]
    environment:
      - NATS_URL=nats://nats_mesh:4222
      - NATS_USER=${NATS_PROVISIONER_USER:-nats_provisioner}
      - NATS_PASSWORD=${NATS_PROVISIONER_PASSWORD:?run friend init to generate NATS credentials}
    networks:
      - ai_mesh_network
    depends_on:
      nats:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # INFRASTRUCTURE (From docker-compose.infra.yml - redeclared for linking)
  # ---------------------------------------------------------------------------
  # In production, these might be external managed services.
  # For now, we assume they are running in the same network 'ai_mesh_network'

  # ---------------------------------------------------------------------------
  # AGENT MICROSERVICES
  # ---------------------------------------------------------------------------

  # 0. SIGNALING SERVER (LiveKit token issuance -- backend/main.py)
  #
  # P3-3 (M1-A4): main.py existed and worked when run directly (`python
  # main.py`, per backend/README.md) but had no compose service at all --
  # confirmed by grepping this whole repo for `uvicorn`/`main:app`/`main.py`
  # and finding zero references in either compose file. The frontend's
  # `useWebRTCVoice.js` fetches `${BACKEND_URL}/token` before it can even
  # open a WebRTC session, so without this the default deployment could
  # bring up every agent cleanly and a user still could not start a
  # conversation -- there was nothing to hand out a LiveKit token at all.
  #
  # Keep the server-internal LiveKit URL separate from the URL returned to a
  # browser. `local_sfu` is resolvable only on this Compose network.
  signaling:
    build:
      context: ./backend
      target: slim
    container_name: signaling
    # Bind-mounted onboarding files must be writable by the host user that
    # launched the stack. start.sh exports these IDs; the fallback preserves
    # the image's historical UID for direct compose use.
    user: "${AI_FRIEND_UID:-1001}:${AI_FRIEND_GID:-1001}"
    command: [ "python", "main.py" ]
    env_file: .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}  # #162: refuses to boot with placeholder secrets
      - NATS_URL=nats://nats_mesh:4222
      - NATS_USER=${NATS_SIGNALING_USER:-signaling}
      - NATS_PASSWORD=${NATS_SIGNALING_PASSWORD:?run friend init to generate NATS credentials}
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://livekit:7880}
      - LIVEKIT_PUBLIC_URL=${LIVEKIT_PUBLIC_URL:-ws://127.0.0.1:7880}
      - BACKEND_BIND_HOST=0.0.0.0
      # Keep onboarding writes on the shared host-backed paths rather than the
      # image's `/` fallback. The persona/voice routers consume these values.
      - AI_FRIEND_APP_ROOT=/app
      - AI_FRIEND_ENV_PATH=/app/.env
    # main.py's own Provisioning Guard (ensure_models_provisioned) is the
    # mechanism that populates this host path in the first place -- without
    # this mount its download lands inside this container's own ephemeral
    # layer instead, at the same /app/models/sensevoice path, so the
    # provisioning happens, is thrown away on the next `up`, and stt_agent's
    # OWN read-only bind mount of this same host directory (see stt_agent's
    # `volumes:` below) never actually gets populated by it. Confirmed live:
    # SenseVoice downloaded successfully into the container but this mount
    # was missing on the first version of this service.
    volumes:
      - ./backend/models/sensevoice:/app/models/sensevoice
      # The web enrollment endpoints write these host-backed files. Without
      # these mounts a successful upload/persona commit only changed the
      # signaling container's ephemeral filesystem and was invisible to the
      # voice/brain agents (and lost on recreation).
      - ./.env:/app/.env
      - ./backend/voice_samples:/app/voice_samples
      - ./personal:/app/personal
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - ai_mesh_network
    depends_on:
      nats:
        condition: service_healthy
      nats_provisioner:
        condition: service_completed_successfully
      livekit:
        condition: service_healthy
    restart: always
    # `wget` (used by vision_agent's own healthcheck, on the `full` target)
    # is not installed on `slim` -- confirmed live: every check failed with
    # "wget: not found" and the container sat marked unhealthy despite
    # actually being fine. `curl` is present on `slim` (the same image
    # brain_agent/subconscious_agent/surfacing_agent already run on); used
    # here instead, matching this service's own real /health endpoint the
    # way those three's `nc -z nats_mesh 4222` probes NATS instead.
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 1. BRAIN AGENT (Logic, RAG, Ollama Client)
  brain_agent:
    build:
      context: ./backend
      target: slim
    container_name: brain_agent
    command: [ "python", "-m", "app.agents.brain_agent" ]
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}  # #162: refuses to boot with placeholder secrets
      - NATS_URL=nats://nats_mesh:4222
      - NATS_USER=${NATS_BRAIN_USER:-brain_agent}
      - NATS_PASSWORD=${NATS_BRAIN_PASSWORD:?run friend init to generate NATS credentials}
      # P3-3 (M1-A3): this used to default to http://local_brain:11434 --
      # the container_name of docker-compose.infra.yml's `ollama` service,
      # which is profiles: ["docker-ollama"] and therefore NOT started by
      # a default `docker compose up`. "Ollama host-native" is the
      # documented default (see CLAUDE.md), so the default here must be
      # host.docker.internal, which extra_hosts below maps to the host --
      # not a container hostname nothing started. Confirmed live: the old
      # default made bootstrap_runtime's ollama-models step fail every
      # retry ("All connection attempts failed") until it exhausted
      # RUNTIME_BOOTSTRAP_RETRIES and crashed, and restart: always turned
      # that into an unbounded crash-loop -- exactly M1-A3's claim.
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - LLM_FAST_MODEL=${LLM_FAST_MODEL:-llama3.2:3b}
      - LLM_CHAT_MODEL=${LLM_CHAT_MODEL:-llama3.2:3b}
      - LLM_REFLECTION_MODEL=${LLM_REFLECTION_MODEL:-llama3.2:3b}
      - LLM_INTENT_CLASSIFICATION_ENABLED=${LLM_INTENT_CLASSIFICATION_ENABLED:-false}
      - REFLECTION_ENABLED=${REFLECTION_ENABLED:-true}
      - REFLECTION_MIN_INTERVAL_SECONDS=${REFLECTION_MIN_INTERVAL_SECONDS:-300}
      - RUNTIME_AUTO_BOOTSTRAP=${RUNTIME_AUTO_BOOTSTRAP:-true}
      - RUNTIME_BOOTSTRAP_RETRIES=${RUNTIME_BOOTSTRAP_RETRIES:-15}
      - OLLAMA_REQUIRED_MODELS=${OLLAMA_REQUIRED_MODELS:-llama3.2:3b,nomic-embed-text}
      - DATABASE_URL=postgresql://ai_friend:${POSTGRES_PASSWORD}@postgres_db:5432/ai_friend_db
      - NEO4J_URI=bolt://brain_graph:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - SYSTEM_TICK_INTERVAL=${SYSTEM_TICK_INTERVAL:-60}
      - STATE_SENSORY_WEIGHT=${STATE_SENSORY_WEIGHT:-0.20}
      - PROACTIVE_ENABLED=${PROACTIVE_ENABLED:-true}
      - PROACTIVE_IDLE_THRESHOLD_SECONDS=${PROACTIVE_IDLE_THRESHOLD_SECONDS:-7200}
      - PROACTIVE_COOLDOWN_SECONDS=${PROACTIVE_COOLDOWN_SECONDS:-3600}
      - PROACTIVE_MIN_ENERGY=${PROACTIVE_MIN_ENERGY:-0.2}
      - USER_TIMEZONE=${USER_TIMEZONE:-}
      - LOG_LEVEL=INFO
      - QDRANT_HOST=brain_vectors
      - MOCK_LLM_TEXT=${MOCK_LLM_TEXT:-false}
      # Web onboarding writes the authored files under the shared personal
      # mount. Explicit paths avoid the container's config/ discovery path
      # silently selecting the generic example persona.
      - PERSONA_PROFILE_PATH=${PERSONA_PROFILE_PATH:-/app/personal/persona.toml}
      - BIOGRAPHY_PATH=${BIOGRAPHY_PATH:-/app/personal/biography.md}
      # #113 / H2: runtime persona evolution (IdentityManager.save()'s fallback
      # when agent_configs is unreachable) needs to land on a volume, not the
      # image's writable layer, or a redeploy silently resets it.
      - IDENTITY_BASE_PATH=/app/data
    volumes:
      - identity_data:/app/data
      - ./personal:/app/personal:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai_mesh_network
    depends_on:
      nats:
        condition: service_healthy
      nats_provisioner:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

    deploy:
      resources:
        # E2: brain_agent is the only service in this file with an explicit cap,
        # yet it's the heaviest one - the full cognitive pipeline (asyncpg pool,
        # neo4j bolt driver, embedding/LLM HTTP buffers, in-process memory cache)
        # runs here, while every sibling service below has no limit at all. 512M
        # was measured tight even in a light benchmark run; give it real headroom
        # instead of a cap likely to OOM-kill mid-session under sustained load.
        limits:
          memory: 2048M
        reservations:
          memory: 512M
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nc -z nats_mesh 4222 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. SYSTEM AGENT (Heartbeat / system.tick publisher)
  system_agent:
    build:
      context: ./backend
      target: slim
    container_name: system_agent
    command: [ "python", "-m", "app.agents.system_agent" ]
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}  # #162: refuses to boot with placeholder secrets
      - NATS_URL=nats://nats_mesh:4222
      - NATS_USER=${NATS_SYSTEM_USER:-system_agent}
      - NATS_PASSWORD=${NATS_SYSTEM_PASSWORD:?run friend init to generate NATS credentials}
      - SYSTEM_TICK_INTERVAL=${SYSTEM_TICK_INTERVAL:-60}
    networks:
      - ai_mesh_network
    depends_on:
      nats:
        condition: service_healthy
      nats_provisioner:
        condition: service_completed_successfully
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nc -z nats_mesh 4222 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2.5. SUBCONSCIOUS AGENT (Background proactive thought generator)
  subconscious_agent:
    build:
      context: ./backend
      target: slim
    container_name: subconscious_agent
    command: [ "python", "-m", "app.agents.subconscious_agent" ]
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}  # #162: refuses to boot with placeholder secrets
      - NATS_URL=nats://nats_mesh:4222
      - NATS_USER=${NATS_SUBCONSCIOUS_USER:-subconscious_agent}
      - NATS_PASSWORD=${NATS_SUBCONSCIOUS_PASSWORD:?run friend init to generate NATS credentials}
      # P3-3 (M1-A3): see brain_agent's own OLLAMA_URL comment above -- same
      # bug, same fix.
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - LLM_FAST_MODEL=${LLM_FAST_MODEL:-llama3.2:3b}
      - LLM_CHAT_MODEL=${LLM_CHAT_MODEL:-llama3.2:3b}
      - LLM_REFLECTION_MODEL=${LLM_REFLECTION_MODEL:-llama3.2:3b}
      - DATABASE_URL=postgresql://ai_friend:${POSTGRES_PASSWORD}@postgres_db:5432/ai_friend_db
      - NEO4J_URI=bolt://brain_graph:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - PROACTIVE_ENABLED=${PROACTIVE_ENABLED:-true}
      - PROACTIVE_IDLE_THRESHOLD_SECONDS=${PROACTIVE_IDLE_THRESHOLD_SECONDS:-7200}
      - PROACTIVE_COOLDOWN_SECONDS=${PROACTIVE_COOLDOWN_SECONDS:-3600}
      - PROACTIVE_MIN_ENERGY=${PROACTIVE_MIN_ENERGY:-0.2}
      - USER_TIMEZONE=${USER_TIMEZONE:-}
      - LOG_LEVEL=INFO
      - QDRANT_HOST=brain_vectors
      - MOCK_LLM_TEXT=${MOCK_LLM_TEXT:-false}
      # #113 / H2: ReflectionService's IdentityManager fallback needs the same
      # persistent, non-image-layer location brain_agent uses above.
      - IDENTITY_BASE_PATH=/app/data
    volumes:
      - identity_data:/app/data
    # P3-3 (M1-A3): brain_agent already had this; this service reaches
    # Ollama the same way and was simply missing it, so host.docker.internal
    # never resolved here even after the URL itself pointed at it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai_mesh_network
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      nats_provisioner:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
      system_agent:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nc -z nats_mesh 4222 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. SURFACING AGENT (Proactive memory recall)
  surfacing_agent:
    build:
      context: ./backend
      target: slim
    container_name: surfacing_agent
    command: [ "python", "-m", "app.agents.surfacing_agent" ]
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}  # #162: refuses to boot with placeholder secrets
      - NATS_URL=nats://nats_mesh:4222
      - NATS_USER=${NATS_SURFACING_USER:-surfacing_agent}
      - NATS_PASSWORD=${NATS_SURFACING_PASSWORD:?run friend init to generate NATS credentials}
      # P3-3 (M1-A3): see brain_agent's own OLLAMA_URL comment above -- same
      # bug, same fix.
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - DATABASE_URL=postgresql://ai_friend:${POSTGRES_PASSWORD}@postgres_db:5432/ai_friend_db
      - NEO4J_URI=bolt://brain_graph:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - QDRANT_HOST=brain_vectors
      - MOCK_LLM_TEXT=${MOCK_LLM_TEXT:-false}
    # P3-3 (M1-A3): see subconscious_agent's own comment above.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai_mesh_network
    depends_on:
      nats:
        condition: service_healthy
      nats_provisioner:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      brain_agent:
        condition: service_healthy
      system_agent:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nc -z nats_mesh 4222 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. VOICE AGENT (TTS, connects to GPT-SoVITS) - Rust-based Default
  voice_agent:
    build:
      context: ./backend
      dockerfile: Dockerfile.rust
      target: runtime
    container_name: voice_agent
    command: [ "voice-agent" ]
    volumes:
      # Phase 1.5: was the unrelated `voice_samples_data` named volume --
      # gpt-sovits reads its reference clips from the host bind
      # ./backend/voice_samples via a *different* mount, so voice-agent's own
      # load_vocalization_pcm fallback (voice_engine_unavailable.wav etc.)
      # could never see files landed there. Same host directory now, so both
      # containers see the same files.
      - ./backend/voice_samples:/app/output
      - ./models:/app/models
    # Was missing entirely (Phase 1.4): the eight REF_*_{CALM,WARM,CONCERNED,
    # EXCITED} vars docs/BRINGING_IT_TO_LIFE.md instructs users to set, plus
    # TTS_CIRCUIT_BREAKER_*/TTS_READINESS_PROBE_INTERVAL_SECS, were silently
    # ignored under Compose because nothing listed them below and nothing
    # loaded .env into the container at all.
    env_file: .env
    environment:
      - NATS_URL=nats://nats_mesh:4222
      - NATS_USER=${NATS_VOICE_USER:-voice_agent}
      - NATS_PASSWORD=${NATS_VOICE_PASSWORD:?run friend init to generate NATS credentials}
      - SOVITS_URL=http://local_voice:9871
      - TTS_LANGUAGE=${TTS_LANGUAGE:-en}
      - SAMPLE_RATE=${SAMPLE_RATE:-32000}
      - REF_AUDIO_PATH=${REF_AUDIO_PATH:-output/sample_en_gold.wav}
      - REF_TEXT=${REF_TEXT:-At the end of the exam, the program shows the performance summary.}
      - REF_AUDIO_PATH_CALM=${REF_AUDIO_PATH_CALM:-}
      - REF_TEXT_CALM=${REF_TEXT_CALM:-}
      - REF_AUDIO_PATH_WARM=${REF_AUDIO_PATH_WARM:-}
      - REF_TEXT_WARM=${REF_TEXT_WARM:-}
      - REF_AUDIO_PATH_CONCERNED=${REF_AUDIO_PATH_CONCERNED:-}
      - REF_TEXT_CONCERNED=${REF_TEXT_CONCERNED:-}
      - REF_AUDIO_PATH_EXCITED=${REF_AUDIO_PATH_EXCITED:-}
      - REF_TEXT_EXCITED=${REF_TEXT_EXCITED:-}
      - TTS_CIRCUIT_BREAKER_FAILURE_THRESHOLD=${TTS_CIRCUIT_BREAKER_FAILURE_THRESHOLD:-3}
      - TTS_CIRCUIT_BREAKER_COOLDOWN_MS=${TTS_CIRCUIT_BREAKER_COOLDOWN_MS:-15000}
      - TTS_READINESS_PROBE_INTERVAL_SECS=${TTS_READINESS_PROBE_INTERVAL_SECS:-45}
    networks:
      - ai_mesh_network
    depends_on:
      brain_agent:
        condition: service_healthy
      nats:
        condition: service_healthy
      nats_provisioner:
        condition: service_completed_successfully
      gpt-sovits:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nc -z nats_mesh 4222 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5


  # 5. TRANSPORT AGENT (WebRTC Bridge)
  transport_agent:
    build:
      context: ./backend
      target: slim
    container_name: transport_agent
    command: [ "python", "-m", "app.agents.transport_agent" ]
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}  # #162: refuses to boot with placeholder secrets
      - NATS_URL=nats://nats_mesh:4222
      - NATS_USER=${NATS_TRANSPORT_USER:-transport_agent}
      - NATS_PASSWORD=${NATS_TRANSPORT_PASSWORD:?run friend init to generate NATS credentials}
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://livekit:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - TRANSPORT_AUDIO_QUEUE_SIZE=${TRANSPORT_AUDIO_QUEUE_SIZE:-1024}
    networks:
      - ai_mesh_network
    depends_on:
      brain_agent:
        condition: service_healthy
      livekit:
        condition: service_healthy
      nats:
        condition: service_healthy
      nats_provisioner:
        condition: service_completed_successfully
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nc -z nats_mesh 4222 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 6. STT AGENT (real recognition, dual-path)
  #
  # The accurate path is whisper.cpp (STT_ACCURATE_MODEL -> final chat.input
  # transcript). The fast path prefers SenseVoice (sherpa-onnx), which classifies
  # speech emotion and audio events (laughter, coughing, ...) alongside the words —
  # the acoustic half of the affect pillar. When no SenseVoice model is mounted the
  # fast path falls back to a small Whisper model (STT_FAST_MODEL): barge-in still
  # works, but the agent hears words without tone, and says so loudly in its logs.
  #
  # Whisper ggml weights are downloaded on first boot into the stt_models_data
  # volume (~220MB). The SenseVoice model is provisioned on the HOST — run
  # `python backend/scripts/bootstrap/provision_models.py` once — and bind-mounted
  # read-only below; the agent does not download it.
  #
  # Set STT_BACKEND=mock (plus RUST_STT_MOCK_TRANSCRIPT) only for CI/offline runs
  # where no model download is possible — it replays a fixed string and is NOT
  # real perception.
  stt_agent:
    build:
      context: ./backend
      dockerfile: Dockerfile.rust
      target: runtime
    container_name: stt_agent
    command: [ "stt-agent" ]
    volumes:
      - stt_models_data:/app/models
      - ./backend/models/sensevoice:/app/models/sensevoice:ro
    environment:
      - NATS_URL=nats://nats_mesh:4222
      - NATS_USER=${NATS_STT_USER:-stt_agent}
      - NATS_PASSWORD=${NATS_STT_PASSWORD:?run friend init to generate NATS credentials}
      - STT_BACKEND=${STT_BACKEND:-whisper}
      - STT_MODEL_DIR=${STT_MODEL_DIR:-/app/models/whisper}
      - STT_SENSEVOICE=${STT_SENSEVOICE:-on}
      - STT_SENSEVOICE_DIR=${STT_SENSEVOICE_DIR:-/app/models/sensevoice}
      - STT_FAST_MODEL=${STT_FAST_MODEL:-tiny.en}
      - STT_ACCURATE_MODEL=${STT_ACCURATE_MODEL:-base.en}
      - STT_LANGUAGE=${STT_LANGUAGE:-en}
      # Fallback only; the true rate is read from the audio.inbound header.
      - STT_TARGET_SAMPLE_RATE=${STT_TARGET_SAMPLE_RATE:-16000}
      - STT_ENDPOINT_SILENCE_MS=${STT_ENDPOINT_SILENCE_MS:-700}
      - STT_MIN_SPEECH_MS=${STT_MIN_SPEECH_MS:-250}
      - STT_PARTIAL_INTERVAL_MS=${STT_PARTIAL_INTERVAL_MS:-500}
      - STT_MAX_UTTERANCE_SECS=${STT_MAX_UTTERANCE_SECS:-30}
      - RUST_STT_MOCK_TRANSCRIPT=${RUST_STT_MOCK_TRANSCRIPT:-}
    networks:
      - ai_mesh_network
    depends_on:
      brain_agent:
        condition: service_healthy
      nats:
        condition: service_healthy
      nats_provisioner:
        condition: service_completed_successfully
    restart: always
    # Was: [ -n "${RUST_STT_MOCK_TRANSCRIPT}" ] && nc -z nats_mesh 4222 || exit 1
    # That was broken twice over: Compose interpolates ${...} at parse time from the
    # HOST env (so it never tested the container), and because the var is undefined
    # in .env.example it collapsed to `[ -n "" ] && ... || exit 1` — i.e. the probe
    # reported unhealthy unconditionally. Use the same liveness probe as every other
    # service in the mesh.
    healthcheck:
      test: ["CMD-SHELL", "nc -z nats_mesh 4222 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5


  # 7. VISION AGENT (OpenCV, Screen/Cam) - Heavy
  #
  # OPT-IN, AND LINUX-HOST ONLY. Start with:
  #     docker compose --profile vision up vision_agent
  #
  # Capture is host-bound and cannot be containerised on every platform. This
  # was verified rather than assumed, on a Windows host with a Linux Docker
  # engine:
  #   - /dev/video* does not exist in the container (no camera)
  #   - `--device=/dev/video0` is rejected by the daemon outright
  #   - /tmp/.X11-unix is absent and DISPLAY is unset (no screen)
  #   - mss itself fails with "Library libxcb.so not found"
  # On a Windows or macOS host the container runs inside a Linux VM with no
  # route to the host's display or USB webcam, so no amount of configuration
  # fixes this. RUN THE AGENT ON THE HOST INSTEAD:
  #     pip install -r backend/requirements-ai.txt
  #     NATS_URL=nats://127.0.0.1:4222 python -m app.vision.agent
  #
  # On a LINUX host the passthrough below does work: uncomment the `devices`
  # entry for camera capture, and/or the X11 mount plus DISPLAY for screen
  # capture. Both are commented out because a missing device makes the whole
  # service fail to start on hosts that do not have it.
  #
  # The healthcheck deliberately probes the sentinel the agent touches on each
  # successful capture, not `pgrep python` — a blind agent keeps its process
  # alive perfectly well, which is how finding E1 hid a stubbed STT for so long.
  vision_agent:
    profiles: [ vision ]
    build:
      context: ./backend
      target: full
    container_name: vision_agent
    command: [ "python", "-m", "app.vision.agent" ]
    env_file: .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}  # #162: refuses to boot with placeholder secrets
      - AGENT_NAME=vision_agent
      - NATS_URL=nats://nats_mesh:4222
      - NATS_USER=${NATS_VISION_USER:-vision_agent}
      - NATS_PASSWORD=${NATS_VISION_PASSWORD:?run friend init to generate NATS credentials}
      # P3-3 (M1-A3): this had no fallback at all (an unset OLLAMA_URL
      # resolved to an empty string) -- see brain_agent's own OLLAMA_URL
      # comment above for the same host.docker.internal reasoning.
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - VISION_HEALTH_FILE=/tmp/vision_agent_healthy
      # Linux host + screen capture: also uncomment the X11 volume below.
      # - DISPLAY=${DISPLAY}
    # volumes:
    #   - /tmp/.X11-unix:/tmp/.X11-unix:ro
    # devices:
    #   - /dev/video0:/dev/video0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      nats:
        condition: service_started
      nats_provisioner:
        condition: service_completed_successfully
    networks:
      - ai_mesh_network
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "test -f /tmp/vision_agent_healthy && test $(( $(date +%s) - $(stat -c %Y /tmp/vision_agent_healthy) )) -lt 60 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # N. WEB FRONTEND (Next.js app -- roadmap Phase 5.4)
  #
  # frontend/Dockerfile has existed since well before this compose file did,
  # and `output: 'standalone'` confirms it was built to be containerized --
  # but no compose file defined a `frontend` service at all: `docker compose
  # up` could bring up the entire agent mesh and there was still nothing
  # serving the browser client that talks to it. `local_sfu`/`signaling` are
  # only resolvable on this compose network; a browser on the host reaches
  # them at their published loopback ports instead, which is why the
  # NEXT_PUBLIC_* build args below default to 127.0.0.1 URLs -- the same
  # ones signaling's own /token response already hands the browser -- not
  # the internal service names every other container in this file uses.
  #
  # Build args, not `environment:`: Next.js inlines NEXT_PUBLIC_* into the JS
  # bundle at build time, so setting them at container start (as every other
  # service here does) would be a silent no-op.
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://127.0.0.1:8000}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-ws://127.0.0.1:7880}
        NEXT_PUBLIC_BACKEND_ACCESS_KEY: ${NEXT_PUBLIC_BACKEND_ACCESS_KEY:-}
    container_name: frontend
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - ai_mesh_network
    depends_on:
      signaling:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

# Use the existing network created by infra
networks:
  ai_mesh_network:
    external: true

volumes:
  stt_models_data:
  identity_data:
