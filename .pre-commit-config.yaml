repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: detect-private-key

  # Must match backend/requirements-dev.txt's ruff pin, which is what CI runs.
  # A different version here lints and formats differently from CI
  # (backend/ruff.toml documents the 0.15 -> 0.16 rule changes).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        # --ignore-words-list: real words codespell does not know (lifesim vocab).
        args: [--ignore-words=.lycheeignore, --ignore-words-list=brunch]
        exclude: (?x)^(.*package-lock\.json|.*pnpm-lock\.yaml|.*yarn\.lock|.*schema\.prisma|\.agents/.*|.*test_identity\.py|.*test_performance\.py|backend/app/state/memory_store\.py)$
