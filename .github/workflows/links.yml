name: Links

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: "0 0 * * 0" # Run weekly

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2.8.0
        with:
          # Website docs use application-root routes (for example
          # /docs/concepts/privacy), which are valid after Next.js routing but
          # are not filesystem paths Lychee can resolve from source Markdown.
          # Keep checking every other Markdown file while excluding this
          # generated-route source tree from the local-file pass.
          args: --verbose --no-progress --max-retries 3 --retry-wait-time 2 --timeout 20 --accept 200,203,403,429 --exclude "https://doi.org/.*" --exclude "https://unitree.com/.*" --exclude "https://tesla.com/.*" --exclude "https://saifmohammad.com/.*" --exclude "http://localhost.*" --exclude-path .agent --exclude-path .agents --exclude-path .claude --exclude-path .gemini --exclude-path .github/skills --exclude-path _archive --exclude-path orchestration/archive '*.md' '**/*.md'
          fail: true
