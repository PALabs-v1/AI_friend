name: 🎭 Persona & Prompt Guard

# Detects changes to the cognitive identity layer and runs
# targeted validation. Catches prompt injection, broken XML
# stripping, and identity seed corruption.

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/app/cognitive/**'
      - 'backend/app/vision/**'
      - 'backend/app/agents/brain_agent.py'
      - 'backend/app/persona/**'
      - 'backend/app/personality.json'
      - 'backend/app/history.json'
      - 'config/persona.toml'
      - 'frontend/prisma/seed.js'

jobs:
  persona-guard:
    name: Identity Continuity Check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Some runners expose a DEBUG environment variable with a non-boolean
    # value. AppSettings is intentionally strict, so keep CI deterministic.
    env:
      DEBUG: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Start NATS (JetStream Enabled)
        run: |
          docker run -d --name nats_mesh -p 4222:4222 -p 8222:8222 nats:latest -js -m 8222

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-base.txt

      - name: Install Dependencies
        run: |
          set -o pipefail
          cd backend
          pip install --upgrade pip
          pip install -r requirements-base.txt
          pip install pytest pytest-asyncio PyYAML Pillow hypothesis==6.168.1
      - name: Build cognitive-rust extension
        run: |
          cd backend
          pip install maturin
          maturin build --manifest-path crates/cognitive-rust/Cargo.toml --out target/wheels
          pip install target/wheels/*.whl

      - name: Wait for NATS
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:8222/healthz > /dev/null && exit 0
            sleep 2
          done
          exit 1

      - name: Setup NATS Streams
        env:
          NATS_URL: nats://localhost:4222
        run: |
          cd backend
          python scripts/bootstrap/setup_nats_streams.py

      - name: Run Identity-Specific Tests
        env:
          NATS_URL: nats://localhost:4222
          LIVEKIT_API_KEY: dummy_key
          LIVEKIT_API_SECRET: dummy_secret
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASSWORD: dummy_password
        run: |
          cd backend
          set -o pipefail
          # Run only tests tagged with identity/persona/state keywords
          pytest -v --tb=short -k "identity or persona or state or emotion or markup" 2>&1 | tee persona_results.txt

      - name: Validate Emotion Markup Stripping
        run: |
          cd backend
          python -c "
          # Was calling ActionService._strip_emotion_wrappers, which does not
          # exist -- so this step raised AttributeError on every run and the
          # trailing '|| echo' swallowed it into a pass. It validated nothing,
          # for as long as it has existed. The real sanitizer is the streaming
          # ControlMarkupSanitizer; no '||' here, so a failure fails the build.
          from app.cognitive.action import ControlMarkupSanitizer

          def sanitize(text, split_at=None):
              s = ControlMarkupSanitizer()
              if split_at is None:
                  return s.feed(text) + s.flush()
              return s.feed(text[:split_at]) + s.feed(text[split_at:]) + s.flush()

          cases = [
              ('<emotion type=\"happy\">Hello!</emotion>', 'Hello!'),
              ('<pause=500>Think about it<hesitate>', '<pause=500>Think about it<hesitate>'),
              ('<emotion anger>Go away</emotion> <pause=200>please', 'Go away <pause=200>please'),
          ]
          for text, expected in cases:
              got = sanitize(text)
              assert got.strip() == expected.strip(), f'FAIL: {text!r} -> {got!r}, expected {expected!r}'

          # The reason the sanitizer is stateful at all: an LLM emits '<',
          # 'emotion', '>' as separate tokens routinely, and a stripper that
          # only sees whole tags leaks the wrapper to the voice layer.
          leaky = '<emotion type=\"sad\">I am here.</emotion>'
          for split_at in range(1, len(leaky)):
              got = sanitize(leaky, split_at)
              assert got.strip() == 'I am here.', f'FAIL at split {split_at}: {got!r}'
          print('✅ Emotion markup stripping holds, including across chunk boundaries')
          "

      - name: Check Identity Seed Consistency
        run: |
          # Verify persona JSON files are valid
          cd backend
          python -c "
          import json, sys
          # Explicit paths, not a glob. The previous glob searched 'persona/**'
          # and 'identity/**' -- neither directory exists under backend/, so it
          # matched nothing and reported success while validating zero files.
          seeds = ['app/personality.json', 'app/history.json']
          errors = []
          for f in seeds:
              try:
                  with open(f) as fp:
                      json.load(fp)
                  print(f'✅ {f}: valid JSON')
              except Exception as e:
                  errors.append(f'{f}: {e}')
                  print(f'❌ {f}: {e}')
          if errors:
              sys.exit(1)
          print(f'✅ All {len(seeds)} identity seed files are valid JSON')
          "

      - name: Validate config/persona.toml
        run: |
          cd backend
          python -m scripts.validate_persona_file

      - name: Upload Persona Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persona-guard-results
          path: backend/persona_results.txt
          retention-days: 7
