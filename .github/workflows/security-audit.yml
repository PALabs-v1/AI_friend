name: 🔒 Security & Secrets Audit

# Prevents accidental credential leaks and validates that
# hardcoded passwords are never committed. Runs on every push.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  gitleaks-scan:
    name: Gitleaks Secret Scan
    # #171: the credential-scan job below is a hand-rolled regex over the
    # current tree - it catches suspicious variable *names* but not actual
    # leaked *values*, and it never looks at history. gitleaks does both: it
    # scans the diff introduced by this push/PR against its own signature
    # and entropy rules, so a real key pasted into any changed file (not
    # just ones matching "password ="-style patterns) gets caught. A full
    # history scan was run manually for the initial audit (see .agents/
    # CONTEXT.md) - this job's job is catching *new* leaks going forward,
    # not re-scanning the past on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks/gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for
      # organization-owned repos (the underlying gitleaks scanner is MIT
      # and free forever; only the Action wrapper added the org gate).
      # Installing and running the CLI directly stays on the free tier.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      # Scoped to the commits this push/PR actually introduces, matching
      # the diff-only behavior gitleaks-action provided (see the job
      # comment above) -- `gitleaks detect` with no --log-opts walks the
      # *entire* history every run, which re-surfaces old, already-reviewed
      # findings (e.g. doc placeholders, hash constants) as failures.
      - name: Run gitleaks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LOG_OPTS="origin/${{ github.event.pull_request.base.ref }}..${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              LOG_OPTS="-1"
            else
              LOG_OPTS="${BEFORE}..${{ github.sha }}"
            fi
          fi
          gitleaks detect --source . --verbose --redact --log-opts="$LOG_OPTS"

  credential-scan:
    name: Credential Leak Prevention
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for diff scanning

      - name: Scan for Hardcoded Secrets
        run: |
          echo "🔍 Scanning for hardcoded credentials..."
          errors=0

          # Pattern 1: Hardcoded passwords in Python/JS (not in .env.example or tests)
          if grep -rn --include="*.py" --include="*.js" --include="*.ts" --include="*.tsx" \
             -E "(password|secret|api_key)\s*=\s*['\"][^'\"]{8,}['\"]" \
             --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=__pycache__ --exclude-dir=tests \
             backend/ frontend/app/ frontend/components/ 2>/dev/null; then
            echo "⚠️ Potential hardcoded secrets found in source code"
            errors=$((errors + 1))
          fi

          # Pattern 2: Default Neo4j password in production code
          if grep -rn "neo4j/password" backend/app/ --include="*.py" 2>/dev/null | \
             grep -v "test" | grep -v "#" | grep -v "\.env"; then
            echo "❌ Default Neo4j password found in production code"
            errors=$((errors + 1))
          fi

          # Pattern 3: Committed .env file (should be gitignored)
          if [ -f "backend/.env" ]; then
            echo "❌ backend/.env is committed — this should be in .gitignore"
            errors=$((errors + 1))
          fi

          # Pattern 4 (P0-1): inline `keys:` block in tracked YAML. This is
          # how livekit.yaml previously shipped a live-looking credential
          # (`devkey: secretsecretsecret`) undetected by Pattern 1, which
          # only scans .py/.js/.ts/.tsx — gitleaks' entropy rules also missed
          # it because the value is low-entropy and placeholder-shaped. A
          # `keys:` mapping is a LiveKit-specific credential block; nothing
          # in this repo's tracked YAML legitimately needs one (keys belong
          # in .env / LIVEKIT_KEYS instead), so any match is a finding.
          # `|| true`: the job runs under `bash -e`, where a pipeline finding
          # nothing exits 1 and would abort the step -- i.e. fail precisely
          # when the check passes.
          yaml_keys_hits=$(grep -rlE "^[[:space:]]*keys:[[:space:]]*$" --include="*.yml" --include="*.yaml" --exclude-dir=node_modules --exclude-dir=.next . 2>/dev/null | grep -v "^\./\.github/workflows/security-audit\.yml$" || true)
          if [ -n "$yaml_keys_hits" ]; then
            echo "❌ Inline 'keys:' block found in tracked YAML — LiveKit (or similar) credentials belong in .env, not committed config"
            echo "$yaml_keys_hits"
            errors=$((errors + 1))
          fi

          if [ $errors -gt 0 ]; then
            echo ""
            echo "🚫 $errors security issue(s) found. Fix before merging."
            exit 1
          fi

          echo "✅ No hardcoded credentials detected"

  dependency-audit:
    name: Python Dependency Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit Backend Dependencies
        run: |
          pip install pip-audit
          cd backend
          set +e
          pip-audit -r requirements-base.txt --desc 2>&1 | tee audit_results.txt
          audit_status=${PIPESTATUS[0]}
          set -e

          # Count high/critical vulnerabilities
          critical=$(grep -Eic "critical|high" audit_results.txt || true)
          if [ "$critical" -gt 0 ]; then
            echo "⚠️ Found $critical high/critical vulnerabilities"
            echo "Review audit_results.txt for details"
            exit 1
          elif [ "$audit_status" -ne 0 ]; then
            echo "❌ pip-audit failed (exit $audit_status) without producing a high/critical finding"
            exit "$audit_status"
          else
            echo "✅ No critical vulnerabilities found"
          fi

      - name: Upload Audit Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: backend/audit_results.txt
          retention-days: 30
