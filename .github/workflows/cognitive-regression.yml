name: 🧠 Cognitive Regression Gate

# Runs the full backend test suite against a live NATS mesh.
# This catches broken subscriptions, stale state hydration,
# persona drift, and memory surfacing regressions.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'frontend/prisma/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'frontend/prisma/**'

jobs:
  cognitive-tests:
    name: Backend Regression Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Some runners expose a DEBUG environment variable with a non-boolean
    # value. AppSettings is intentionally strict, so keep CI deterministic.
    env:
      DEBUG: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Start NATS (JetStream Enabled)
        run: |
          docker run -d --name nats_mesh -p 4222:4222 -p 8222:8222 nats:latest -js -m 8222

      - name: Wait for NATS Readiness
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8222/healthz > /dev/null; then
              echo "✅ NATS is ready"
              exit 0
            fi
            echo "⏳ Waiting for NATS... ($i/15)"
            sleep 2
          done
          echo "❌ NATS failed to start"
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-base.txt

      - name: Install Dependencies
        run: |
          set -o pipefail
          cd backend
          pip install --upgrade pip
          pip install -r requirements-base.txt
          pip install pytest pytest-asyncio PyYAML Pillow hypothesis==6.168.1
      - name: Build cognitive-rust extension
        run: |
          cd backend
          pip install maturin
          maturin build --manifest-path crates/cognitive-rust/Cargo.toml --out target/wheels
          pip install target/wheels/*.whl

      - name: Setup NATS Streams
        env:
          NATS_URL: nats://localhost:4222
        run: |
          cd backend
          python scripts/bootstrap/setup_nats_streams.py

      - name: Run Cognitive Regression Suite
        env:
          NATS_URL: nats://localhost:4222
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ci_test_password
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          LIVEKIT_API_KEY: dummy_key
          LIVEKIT_API_SECRET: dummy_secret
        run: |
          cd backend
          set -o pipefail
          pytest -v --tb=short -x 2>&1 | tee test_results.txt
          echo "test_count=$(grep -c 'PASSED\|FAILED' test_results.txt || echo 0)" >> $GITHUB_OUTPUT

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-test-results
          path: backend/test_results.txt
          retention-days: 14
