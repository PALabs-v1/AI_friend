name: 📦 Docker Image Health

# Builds all agent images and validates they can start.
# Catches missing dependencies, broken entrypoints, and
# import errors that only surface inside the container.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'backend/Dockerfile*'
      - 'backend/requirements*.txt'
      - 'docker-compose*.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/Dockerfile*'
      - 'backend/requirements*.txt'
      - 'docker-compose*.yml'

jobs:
  build-agents:
    name: Build & Smoke Test Agent Images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        agent:
          - name: brain_agent
            target: slim
            module: app.agents.brain_agent
          - name: system_agent
            target: slim
            module: app.agents.system_agent
          - name: subconscious_agent
            target: slim
            module: app.agents.subconscious_agent
          - name: surfacing_agent
            target: slim
            module: app.agents.surfacing_agent
          - name: transport_agent
            target: slim
            module: app.agents.transport_agent

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.agent.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: ${{ matrix.agent.target }}
          push: false
          load: true
          tags: cvs/${{ matrix.agent.name }}:ci
          cache-from: type=gha,scope=${{ matrix.agent.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.agent.name }}

      - name: Smoke Test — Verify Python Imports
        run: |
          # Verify the agent module can be imported without crashing
          docker run --rm \
            -e NATS_URL=nats://localhost:4222 \
            -e LIVEKIT_API_KEY=dummy_key \
            -e LIVEKIT_API_SECRET=dummy_secret \
            -e DATABASE_URL=postgresql://test:test@localhost:5432/test \
            -e NEO4J_URI=bolt://localhost:7687 \
            -e NEO4J_PASSWORD=dummy_password \
            cvs/${{ matrix.agent.name }}:ci \
            python -c "import ${{ matrix.agent.module }}; print('✅ ${{ matrix.agent.name }} imports OK')"

      - name: Smoke Test — Verify netcat installed
        run: |
          # Health probes depend on netcat being present
          docker run --rm cvs/${{ matrix.agent.name }}:ci \
            which nc && echo "✅ netcat available" || { echo "❌ netcat missing"; exit 1; }

  compose-config:
    name: Unified Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate CI .env
        run: |
          cat > .env << 'EOF'
          LIVEKIT_API_KEY=ci_dummy
          LIVEKIT_API_SECRET=ci_dummy
          LIVEKIT_KEYS="ci_dummy: ci_dummy"
          POSTGRES_PASSWORD=ci_dummy
          NEO4J_URI=bolt://localhost:7687
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=ci_dummy
          NEO4J_AUTH=neo4j/ci_dummy
          NEO4J_PLUGINS=["apoc"]
          NATS_URL=nats://localhost:4222
          NATS_PROVISIONER_PASSWORD=ci_dummy_provisioner
          NATS_SIGNALING_PASSWORD=ci_dummy_signaling
          NATS_BRAIN_PASSWORD=ci_dummy_brain
          NATS_SUBCONSCIOUS_PASSWORD=ci_dummy_subconscious
          NATS_SURFACING_PASSWORD=ci_dummy_surfacing
          NATS_SYSTEM_PASSWORD=ci_dummy_system
          NATS_TRANSPORT_PASSWORD=ci_dummy_transport
          NATS_STT_PASSWORD=ci_dummy_stt
          NATS_VISION_PASSWORD=ci_dummy_vision
          NATS_VOICE_PASSWORD=ci_dummy_voice
          OLLAMA_URL=http://localhost:11434
          SOVITS_URL=http://localhost:9871
          DATABASE_URL=postgresql://ai_friend:ci_dummy@localhost:5432/ai_friend_db
          EOF

      - name: Validate Phased Startup Config
        run: |
          docker compose -f docker-compose.infra.yml -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.infra.yml -f docker-compose.prod.yml -f docker-compose.light.yml config --quiet
          docker compose -f docker-compose.infra.yml -f docker-compose.prod.yml -f docker-compose.heavy.yml config --quiet
          echo "✅ Unified compose config is valid"
