name: 🍏 macOS Compatibility CI

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/**'
      - 'docker-compose.infra.yml'
      - 'docker-compose.prod.yml'
      - 'docker-compose.macos*.yml'
      - '.github/workflows/macos-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'docker-compose.infra.yml'
      - 'docker-compose.prod.yml'
      - 'docker-compose.macos*.yml'
      - '.github/workflows/macos-ci.yml'

permissions:
  contents: read

jobs:
  backend-macos:
    name: Backend Lint + Tests (macOS)
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # tests/test_nats_grants.py reads nats-accounts.conf at 657c483f
          # (`git show`); a shallow clone cannot resolve that commit.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-base.txt

      - name: Install NATS server
        run: brew install nats-server

      - name: Start NATS (JetStream enabled)
        run: |
          bash scripts/ci/start_nats_mesh.sh native
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8222/healthz > /dev/null; then
              echo "✅ NATS is ready"
              exit 0
            fi
            echo "⏳ Waiting for NATS... ($i/20)"
            sleep 1
          done
          echo "❌ NATS failed to start"
          cat /tmp/nats.log || true
          exit 1

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Cargo Check Rust Workspace
        run: |
          cd backend
          cargo check --workspace
      - name: Cargo Test Rust Workspace (audit/ROADMAP.md P2-11)
        run: |
          cd backend
          cargo test --workspace
      - name: Build cognitive-rust extension
        run: |
          cd backend
          pip install maturin
          maturin build --manifest-path crates/cognitive-rust/Cargo.toml --out target/wheels
          pip install target/wheels/*.whl

      - name: Setup NATS streams
        env:
          NATS_URL: nats://localhost:4222
        run: |
          cd backend
          NATS_USER=nats_provisioner NATS_PASSWORD="$NATS_PROVISIONER_PASSWORD" python scripts/bootstrap/setup_nats_streams.py

      - name: Backend lint (ruff)
        run: |
          cd backend
          ruff check app/ tests/ --output-format=github

      - name: Backend tests
        env:
          NATS_URL: nats://localhost:4222
          LIVEKIT_API_KEY: dummy_key
          LIVEKIT_API_SECRET: dummy_secret
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASSWORD: dummy_password
        run: |
          cd backend
          pytest -q --cov=app --cov-report=term-missing
