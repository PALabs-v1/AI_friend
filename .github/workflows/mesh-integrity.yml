name: 🛡️ Mesh & Schema Integrity

# Validates that the Docker orchestration files parse correctly,
# the Prisma schema is valid, and identity seed files exist.
# Catches broken compose configs and schema drift BEFORE merge.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'docker-compose*.yml'
      - 'backend/Dockerfile*'
      - 'frontend/prisma/**'
      - '.env.example'
      - 'backend/app/cognitive/identity.py'
      - 'backend/app/**'
      - 'backend/crates/**'
      - 'backend/scripts/check_subject_wiring.py'
  pull_request:
    branches: [main, master]
    paths:
      - 'docker-compose*.yml'
      - 'backend/Dockerfile*'
      - 'frontend/prisma/**'
      - '.env.example'
      - 'backend/app/cognitive/identity.py'
      - 'backend/app/**'
      - 'backend/crates/**'
      - 'backend/scripts/check_subject_wiring.py'

jobs:
  compose-validation:
    name: Docker Compose Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate CI .env
        run: |
          cat > .env << 'EOF'
          LIVEKIT_API_KEY=ci_dummy
          LIVEKIT_API_SECRET=ci_dummy
          LIVEKIT_KEYS="ci_dummy: ci_dummy"
          POSTGRES_PASSWORD=ci_dummy
          NEO4J_URI=bolt://localhost:7687
          NEO4J_USER=neo4j
          NEO4J_PASSWORD=ci_dummy
          NEO4J_AUTH=neo4j/ci_dummy
          NEO4J_PLUGINS=["apoc"]
          NATS_URL=nats://localhost:4222
          OLLAMA_URL=http://localhost:11434
          SOVITS_URL=http://localhost:9871
          DATABASE_URL=postgresql://ai_friend:ci_dummy@localhost:5432/ai_friend_db
          EOF

      - name: Validate Infrastructure Compose
        run: docker compose -f docker-compose.infra.yml config --quiet

      - name: Validate Unified Phased Startup (Infra + Agents)
        run: docker compose -f docker-compose.infra.yml -f docker-compose.prod.yml config --quiet

      - name: Check no service publishes off loopback (P0-2)
        # audit/ (M4-S3, M4-S8) found every infra service bound to 0.0.0.0 by
        # default, including the unauthenticated LiveKit SFU -- reachable by
        # anything on the LAN. Every host port mapping must be prefixed
        # 127.0.0.1: unless the line carries a "# lan-exposed: <reason>"
        # annotation explaining why that one service needs LAN reach.
        run: |
          # `|| true`: the job runs under `bash -e`, where a pipeline finding
          # nothing exits 1 and would abort the step -- i.e. fail precisely
          # when every port is correctly loopback-bound.
          exposed=$(grep -nE '^[[:space:]]*-[[:space:]]*"[0-9]' docker-compose.infra.yml docker-compose.prod.yml 2>/dev/null | grep -vE '"127\.0\.0\.1:' | grep -v '# lan-exposed:' || true)
          if [ -n "$exposed" ]; then
            echo "❌ Port mapping(s) not bound to 127.0.0.1 and not annotated with '# lan-exposed: <reason>':"
            echo "$exposed"
            exit 1
          fi
          echo "✅ Every published port is loopback-bound (or explicitly annotated as LAN-exposed)"

  prisma-validation:
    name: Prisma Schema & Identity Seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Prisma CLI
        run: |
          cd frontend
          npm ci

      - name: Validate Prisma Schema
        run: |
          cd frontend
          npx prisma validate
          echo "✅ Prisma schema is valid"

      - name: Check Identity Seed Exists
        run: |
          if [ ! -f frontend/prisma/seed.js ]; then
            echo "❌ Identity seed file missing: frontend/prisma/seed.js"
            exit 1
          fi
          echo "✅ Identity seed file found"

  env-completeness:
    name: Environment Variable Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check .env.example covers all compose references
        run: |
          echo "🔍 Scanning compose files for \${VAR} references..."
          # Extract all ${VAR} and ${VAR:-default} references from compose files
          compose_vars=$(grep -oP '\$\{(\w+)' docker-compose.infra.yml docker-compose.prod.yml \
            | sed 's/.*\${\(.*\)/\1/' | sort -u)

          missing=""
          for var in $compose_vars; do
            if ! grep -q "^${var}=" .env.example 2>/dev/null && \
               ! grep -q "^# .*${var}" .env.example 2>/dev/null; then
              missing="$missing $var"
            fi
          done

          if [ -n "$missing" ]; then
            echo "⚠️ Variables referenced in compose but missing from .env.example:"
            for v in $missing; do echo "  - $v"; done
            echo ""
            echo "Add them to .env.example so new developers don't miss them."
            # Warning only, not a hard fail
          else
            echo "✅ All compose variables are documented in .env.example"
          fi

  subject-wiring:
    name: NATS Subject Wiring (P1-8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check every subject is wired at both ends or explicitly allowlisted
        working-directory: backend
        run: python scripts/check_subject_wiring.py
