name: Production Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Backend Slim Image
      uses: docker/build-push-action@v6
      with:
        context: ./backend
        file: ./backend/Dockerfile
        target: slim
        push: false
        tags: ai-friend/backend-slim:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build Backend Full Image
      uses: docker/build-push-action@v6
      with:
        context: ./backend
        file: ./backend/Dockerfile
        target: full
        push: false
        tags: ai-friend/backend-full:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build Backend Rust Image
      uses: docker/build-push-action@v6
      with:
        context: ./backend
        file: ./backend/Dockerfile.rust
        target: runtime
        push: false
        tags: ai-friend/backend-rust:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Validate Production Compose Config
      run: |
        # Create dummy .env for config check (values don't matter for 'config' command)
        touch .env
        echo "LIVEKIT_API_KEY=dummy" >> .env
        echo "LIVEKIT_API_SECRET=dummy" >> .env
        echo "POSTGRES_PASSWORD=dummy" >> .env
        echo "NEO4J_AUTH=neo4j/dummy" >> .env
        echo "DATABASE_URL=postgresql://dummy" >> .env
        # W10a: compose refuses to interpolate without the per-agent NATS passwords
        echo "NATS_PROVISIONER_PASSWORD=ci_dummy_provisioner" >> .env
        echo "NATS_SIGNALING_PASSWORD=ci_dummy_signaling" >> .env
        echo "NATS_BRAIN_PASSWORD=ci_dummy_brain" >> .env
        echo "NATS_SUBCONSCIOUS_PASSWORD=ci_dummy_subconscious" >> .env
        echo "NATS_SURFACING_PASSWORD=ci_dummy_surfacing" >> .env
        echo "NATS_SYSTEM_PASSWORD=ci_dummy_system" >> .env
        echo "NATS_TRANSPORT_PASSWORD=ci_dummy_transport" >> .env
        echo "NATS_STT_PASSWORD=ci_dummy_stt" >> .env
        echo "NATS_VISION_PASSWORD=ci_dummy_vision" >> .env
        echo "NATS_VOICE_PASSWORD=ci_dummy_voice" >> .env

        # Verify the compose files parse correctly together
        docker compose -f docker-compose.infra.yml -f docker-compose.prod.yml config
